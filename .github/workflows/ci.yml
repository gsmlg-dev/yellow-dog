  #       uses: actions/checkout@v4
  #     - name: Set up Elixir
  #       uses: erlef/setup-beam@v1
  #       with:
  #         elixir-version: '1.18'
  #         otp-version: '28'
  #     - name: Install dependencies
  #       run: mix deps.get
  #     - name: Run Dialyzer
  #       run: mix dialyzer --halt-exit-status
