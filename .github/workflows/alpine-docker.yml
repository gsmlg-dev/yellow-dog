name: Manual Build YellowDog DNS alpine image

on:
  workflow_dispatch:

jobs:
  build-image:
    runs-on: ubuntu-latest
    steps:
      -
        name: Checkout
        uses: actions/checkout@v4
      -
        name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      -
        name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      -
        name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USER }}
          password: ${{ secrets.DOCKERHUB_PASSWD }}
      - 
        name: Login to Github Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.PERSONAL_ACCESS_TOKEN }}
      -
        name: Get version
        id: version
        run: |
          VERSION=$(cat mix.exs |grep version: | cut -d'"' -f2)
          echo "current version: $VERSION"
          echo version=$VERSION >> $GITHUB_OUTPUT
      -
        name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          push: true
          build-args: |
            RELEASE_VERSION=${{ steps.version.outputs.version }}
          tags: |
            docker.io/gsmlg/yellowdogdns:v${{ steps.version.outputs.version }}
            docker.io/gsmlg/yellowdogdns:alpine
            ghcr.io/gsmlg-dev/yellowdogdns:v${{ steps.version.outputs.version }}
            ghcr.io/gsmlg-dev/yellowdogdns:alpine
