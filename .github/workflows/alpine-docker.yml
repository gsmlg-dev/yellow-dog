name: Manual Build YellowDog DNS alpine image

on:
  workflow_dispatch:
    inputs:
      image-tag:
        required: true
        description: 'docker image tag'
        default: "v1.1.1"
      release-version:
        required: true
        description: 'mix release version'
        default: "1.1.1"

jobs:
  build-image:
    runs-on: ubuntu-latest
    steps:
      -
        name: Checkout
        uses: actions/checkout@v4
      -
        name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      -
        name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      -
        name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USER }}
          password: ${{ secrets.DOCKERHUB_PASSWD }}
      - 
        name: Login to Github Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.PERSONAL_ACCESS_TOKEN }}
      -
        name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            RELEASE_VERSION=${{ github.event.inputs.release-version }}
          tags: |
            docker.io/gsmlg/yellowdogdns:${{ github.event.inputs.image-tag }}
            docker.io/gsmlg/yellowdogdns:alpine
            ghcr.io/gsmlg-dev/yellowdogdns:${{ github.event.inputs.image-tag }}
            ghcr.io/gsmlg-dev/yellowdogdns:alpine
