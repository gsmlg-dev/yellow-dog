name: Manual Debian Product Images

on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish both product images to GHCR
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build-image:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        product: [management, worker]
    steps:
      -
        name: Checkout
        uses: actions/checkout@v6
      -
        name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      -
        name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - 
        name: Login to Github Container Registry
        uses: docker/login-action@v3
        if: inputs.publish
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      -
        name: Get version
        id: version
        run: |
          repository=$(printf '%s' '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')
          version=$(sed -n 's/.*version: "\([^"]*\)".*/\1/p' mix.exs | head -1)
          echo "image=ghcr.io/$repository-${{ matrix.product }}" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      -
        name: Build independent products
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64,linux/arm64
          push: ${{ inputs.publish }}
          build-args: |
            MIX_RELEASE_NAME=yellow_dog_${{ matrix.product }}
            RELEASE_VERSION=${{ steps.version.outputs.version }}
          tags: |
            ${{ steps.version.outputs.image }}:${{ steps.version.outputs.version }}
            ${{ steps.version.outputs.image }}:latest
