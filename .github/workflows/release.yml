name: release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g. 1.2.3)'
        required: true
        type: string
      git_ref:
        description: 'Git ref to release from'
        required: true
        default: 'main'
        type: string

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  create-release:
    name: Create release v${{ inputs.version }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      version: ${{ steps.release.outputs.version }}
    env:
      VERSION: ${{ inputs.version }}
      RELEASE_TAG: v${{ inputs.version }}
    steps:
      - name: Checkout repo at ${{ inputs.git_ref }}
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.git_ref }}
          fetch-depth: 0

      - name: Validate release version
        run: |
          set -euo pipefail
          if [[ "${VERSION}" == v* ]]; then
            echo "version input must not include a leading v" >&2
            exit 1
          fi

      - name: Bump version in mix.exs
        run: |
          set -euo pipefail
          sed -i -E "s/version: \"[^\"]+\"/version: \"${VERSION}\"/" mix.exs
          grep -q "version: \"${VERSION}\"" mix.exs

      - name: Commit version bump and tag
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add mix.exs

          if git diff --cached --quiet; then
            echo "mix.exs is already at ${VERSION}; tagging current ref"
          else
            git commit -m "chore(release): v${VERSION}"
            git push origin "HEAD:${{ inputs.git_ref }}"
          fi

          if git rev-parse --verify --quiet "refs/tags/${RELEASE_TAG}" >/dev/null; then
            echo "tag ${RELEASE_TAG} already exists; reusing it"
          else
            git tag "${RELEASE_TAG}"
            git push origin "${RELEASE_TAG}"
          fi

      - name: Create GitHub Release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view "${RELEASE_TAG}" >/dev/null 2>&1; then
            echo "release ${RELEASE_TAG} already exists; reusing it"
          else
            gh release create "${RELEASE_TAG}" \
              --title "${RELEASE_TAG}" \
              --generate-notes \
              --verify-tag
          fi

          echo "tag=${RELEASE_TAG}" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

  build-release-assets:
    name: Build ${{ matrix.product_slug }} ${{ matrix.platform }} ${{ matrix.arch }}
    needs: create-release
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - product_slug: yellow-dog
            mix_release: yellow_dog_server
            platform: linux
            arch: amd64
            runner: ubuntu-latest
          - product_slug: yellow-dog
            mix_release: yellow_dog_server
            platform: linux
            arch: arm64
            runner: ubuntu-24.04-arm
          - product_slug: yellow-dog
            mix_release: yellow_dog_server
            platform: macos
            arch: amd64
            runner: macos-15-intel
          - product_slug: yellow-dog
            mix_release: yellow_dog_server
            platform: macos
            arch: arm64
            runner: macos-15
          - product_slug: yellow-dog-netman
            mix_release: yellow_dog_netman
            platform: linux
            arch: amd64
            runner: ubuntu-latest
          - product_slug: yellow-dog-netman
            mix_release: yellow_dog_netman
            platform: linux
            arch: arm64
            runner: ubuntu-24.04-arm
    env:
      MIX_ENV: prod
      SECRET_KEY_BASE: release-build-secret-key-base-release-build-secret-key-base
      VERSION: ${{ needs.create-release.outputs.version }}
      RELEASE_TAG: ${{ needs.create-release.outputs.tag }}
      MIX_RELEASE_NAME: ${{ matrix.mix_release }}
      PRODUCT_SLUG: ${{ matrix.product_slug }}
      PLATFORM: ${{ matrix.platform }}
      ARCH: ${{ matrix.arch }}
    steps:
      - name: Checkout release tag
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.create-release.outputs.tag }}
          fetch-depth: 0

      - name: Set up Elixir
        uses: erlef/setup-beam@v1
        with:
          elixir-version: '1.18'
          otp-version: '28'

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y inotify-tools

      - name: Restore build cache
        uses: actions/cache@v5
        with:
          path: |
            ~/.hex
            ~/.cache/rebar3
            deps
            _build
            apps/abyss/native/dhcp_socket/target
            apps/yellow_dog_netman/native/netlink_helper/target
          key: release-${{ runner.os }}-${{ matrix.arch }}-${{ matrix.product_slug }}-${{ hashFiles('mix.lock', '**/Cargo.lock') }}
          restore-keys: |
            release-${{ runner.os }}-${{ matrix.arch }}-${{ matrix.product_slug }}-
            release-${{ runner.os }}-${{ matrix.arch }}-

      - name: Install dependencies
        run: |
          set -euo pipefail
          mix local.hex --force
          mix local.rebar --force
          mix deps.get --only prod

      - name: Build Netman native helper
        if: matrix.mix_release == 'yellow_dog_netman'
        run: |
          set -euo pipefail
          cargo build --release --manifest-path apps/yellow_dog_netman/native/netlink_helper/Cargo.toml
          mkdir -p apps/yellow_dog_netman/priv/native
          cp apps/yellow_dog_netman/native/netlink_helper/target/release/netlink_helper apps/yellow_dog_netman/priv/native/
          chmod 755 apps/yellow_dog_netman/priv/native/netlink_helper

      - name: Build console assets
        if: matrix.mix_release == 'yellow_dog_server'
        working-directory: apps/yellow_dog_console
        run: |
          set -euo pipefail
          mix assets.setup
          mix assets.deploy

      - name: Build Mix release
        run: |
          set -euo pipefail
          mix release "${MIX_RELEASE_NAME}" --version "${VERSION}" --overwrite

      - name: Package release tarball
        id: package
        run: |
          set -euo pipefail
          artifact="${PRODUCT_SLUG}-v${VERSION}-${PLATFORM}-${ARCH}.tar.gz"
          tar -czf "${artifact}" -C "_build/prod/rel/${MIX_RELEASE_NAME}" .
          echo "artifact=${artifact}" >> "$GITHUB_OUTPUT"

      - name: Upload release tarball
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release upload "${RELEASE_TAG}" "${{ steps.package.outputs.artifact }}" --clobber

  docker-image:
    name: Build and publish Docker image
    needs: create-release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    env:
      VERSION: ${{ needs.create-release.outputs.version }}
      RELEASE_TAG: ${{ needs.create-release.outputs.tag }}
      REGISTRY: ghcr.io
    steps:
      - name: Checkout release tag
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.create-release.outputs.tag }}
          fetch-depth: 0

      - name: Resolve image name
        id: image
        run: |
          set -euo pipefail
          image_name="$(echo "${GITHUB_REPOSITORY}" | tr '[:upper:]' '[:lower:]')"
          echo "name=${image_name}" >> "$GITHUB_OUTPUT"
          echo "ref=${REGISTRY}/${image_name}" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Build and push image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            RELEASE_VERSION=${{ env.VERSION }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.version=${{ env.VERSION }}
            org.opencontainers.image.revision=${{ github.sha }}
          tags: |
            ${{ steps.image.outputs.ref }}:${{ env.VERSION }}
            ${{ steps.image.outputs.ref }}:${{ env.RELEASE_TAG }}
            ${{ steps.image.outputs.ref }}:latest

      - name: Add Docker image info to release notes
        env:
          GH_TOKEN: ${{ github.token }}
          IMAGE_REF: ${{ steps.image.outputs.ref }}
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          gh release view "${RELEASE_TAG}" --json body --jq '.body' > release-body.md

          cat > docker-image-notes.md <<EOF
          ## Docker image

          Pull the release image:

          \`\`\`sh
          docker pull ${IMAGE_REF}:${VERSION}
          docker pull ${IMAGE_REF}:${RELEASE_TAG}
          docker pull ${IMAGE_REF}:latest
          \`\`\`

          Multi-arch platforms: \`linux/amd64\`, \`linux/arm64\`

          Digest: \`${IMAGE_REF}@${IMAGE_DIGEST}\`
          EOF

          awk '
            /^## Docker image$/ { skip = 1; next }
            /^## / && skip { skip = 0 }
            !skip { print }
          ' release-body.md > release-body-base.md

          {
            cat release-body-base.md
            printf '\n\n'
            cat docker-image-notes.md
          } > release-body-updated.md

          gh release edit "${RELEASE_TAG}" --notes-file release-body-updated.md
