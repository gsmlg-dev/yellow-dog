name: release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g. 1.2.3)'
        required: true
        type: string
      git_ref:
        description: 'Git ref to release from'
        required: true
        default: 'main'
        type: string

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  create-release:
    name: Create release v${{ inputs.version }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      version: ${{ steps.release.outputs.version }}
    env:
      VERSION: ${{ inputs.version }}
      RELEASE_TAG: v${{ inputs.version }}
      GIT_REF: ${{ inputs.git_ref }}
    steps:
      - name: Checkout repo at ${{ inputs.git_ref }}
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.git_ref }}
          fetch-depth: 0

      - name: Validate release version
        run: |
          set -euo pipefail

          if [[ ! "${VERSION}" =~ ^[0-9]+[.][0-9]+[.][0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "version input must be a semver value without a leading v" >&2
            exit 1
          fi

          if [[ "${GIT_REF}" =~ (^/|/$|\\.\\.|@\\{|\\\\|[[:space:]]|^-) ]]; then
            echo "git_ref contains unsafe characters" >&2
            exit 1
          fi

          if ! git check-ref-format --allow-onelevel "${GIT_REF}" >/dev/null; then
            echo "git_ref is not a valid git ref name" >&2
            exit 1
          fi

      - name: Bump version in mix.exs
        run: |
          set -euo pipefail
          sed -i -E "s/version: \"[^\"]+\"/version: \"${VERSION}\"/" mix.exs
          grep -q "version: \"${VERSION}\"" mix.exs

      - name: Commit version bump and tag
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add mix.exs

          if git diff --cached --quiet; then
            echo "mix.exs is already at ${VERSION}; tagging current ref"
          else
            git commit -m "chore(release): v${VERSION}"
            git push origin "HEAD:${GIT_REF}"
          fi

          if git rev-parse --verify --quiet "refs/tags/${RELEASE_TAG}" >/dev/null; then
            echo "tag ${RELEASE_TAG} already exists; reusing it"
          else
            git tag "${RELEASE_TAG}"
            git push origin "${RELEASE_TAG}"
          fi

      - name: Create GitHub Release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view "${RELEASE_TAG}" >/dev/null 2>&1; then
            echo "release ${RELEASE_TAG} already exists; reusing it"
          else
            gh release create "${RELEASE_TAG}" \
              --title "${RELEASE_TAG}" \
              --generate-notes \
              --verify-tag
          fi

          echo "tag=${RELEASE_TAG}" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

  build-release-assets:
    name: Build ${{ matrix.product_slug }} ${{ matrix.platform }} ${{ matrix.arch }}
    needs: create-release
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - product_slug: yellow-dog-management-core
            mix_release: yellow_dog_management_core
            platform: linux
            arch: amd64
            runner: ubuntu-latest
          - product_slug: yellow-dog-server
            mix_release: yellow_dog_server
            platform: linux
            arch: amd64
            runner: ubuntu-latest
          - product_slug: yellow-dog-server
            mix_release: yellow_dog_server
            platform: linux
            arch: arm64
            runner: ubuntu-24.04-arm
          - product_slug: yellow-dog-netman
            mix_release: yellow_dog_netman
            platform: linux
            arch: amd64
            runner: ubuntu-latest
          - product_slug: yellow-dog-netman
            mix_release: yellow_dog_netman
            platform: linux
            arch: arm64
            runner: ubuntu-24.04-arm
    env:
      MIX_ENV: prod
      SECRET_KEY_BASE: release-build-secret-key-base-release-build-secret-key-base
      VERSION: ${{ needs.create-release.outputs.version }}
      RELEASE_TAG: ${{ needs.create-release.outputs.tag }}
      MIX_RELEASE_NAME: ${{ matrix.mix_release }}
      PRODUCT_SLUG: ${{ matrix.product_slug }}
      PLATFORM: ${{ matrix.platform }}
      ARCH: ${{ matrix.arch }}
    steps:
      - name: Checkout release tag
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.create-release.outputs.tag }}
          fetch-depth: 0

      - name: Set up Elixir
        uses: erlef/setup-beam@v1
        with:
          elixir-version: '1.18'
          otp-version: '28'

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y inotify-tools

      - name: Restore build cache
        uses: actions/cache@v5
        with:
          path: |
            ~/.hex
            ~/.cache/rebar3
            deps
            _build
            apps/abyss/native/dhcp_socket/target
            apps/yellow_dog_netman/native/netlink_helper/target
          key: release-${{ runner.os }}-${{ matrix.arch }}-${{ matrix.product_slug }}-${{ hashFiles('mix.lock', '**/Cargo.lock') }}
          restore-keys: |
            release-${{ runner.os }}-${{ matrix.arch }}-${{ matrix.product_slug }}-
            release-${{ runner.os }}-${{ matrix.arch }}-

      - name: Install dependencies
        run: |
          set -euo pipefail
          mix local.hex --force
          mix local.rebar --force
          mix deps.get --only prod

      - name: Build Netman native helper
        if: matrix.mix_release == 'yellow_dog_netman'
        run: |
          set -euo pipefail
          cargo build --release --manifest-path apps/yellow_dog_netman/native/netlink_helper/Cargo.toml
          mkdir -p apps/yellow_dog_netman/priv/native
          cp apps/yellow_dog_netman/native/netlink_helper/target/release/netlink_helper apps/yellow_dog_netman/priv/native/
          chmod 755 apps/yellow_dog_netman/priv/native/netlink_helper

      - name: Build console assets
        if: matrix.mix_release == 'yellow_dog_management_core'
        working-directory: apps/yellow_dog_console
        run: |
          set -euo pipefail
          mix assets.setup
          mix assets.deploy

      - name: Build Mix release
        run: |
          set -euo pipefail
          mix release "${MIX_RELEASE_NAME}" --version "${VERSION}" --overwrite

      - name: Package release tarball
        id: package
        run: |
          set -euo pipefail
          artifact="${PRODUCT_SLUG}-v${VERSION}-${PLATFORM}-${ARCH}.tar.gz"
          tar -czf "${artifact}" -C "_build/prod/rel/${MIX_RELEASE_NAME}" .
          echo "artifact=${artifact}" >> "$GITHUB_OUTPUT"

      - name: Upload release tarball
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT: ${{ steps.package.outputs.artifact }}
        run: |
          set -euo pipefail
          gh release upload "${RELEASE_TAG}" "${ARTIFACT}" --clobber

  docker-image:
    name: Build and publish ${{ matrix.image_label }} Docker image
    needs: create-release
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - image_key: management-core
            image_label: management_core
            mix_release: yellow_dog_management_core
            image_suffix: -management-core
            image_title: YellowDog Management Core
          - image_key: server
            image_label: server
            mix_release: yellow_dog_server
            image_suffix: ''
            image_title: YellowDog Server
    env:
      VERSION: ${{ needs.create-release.outputs.version }}
      RELEASE_TAG: ${{ needs.create-release.outputs.tag }}
      REGISTRY: ghcr.io
      IMAGE_KEY: ${{ matrix.image_key }}
      IMAGE_SUFFIX: ${{ matrix.image_suffix }}
      IMAGE_TITLE: ${{ matrix.image_title }}
    steps:
      - name: Checkout release tag
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.create-release.outputs.tag }}
          fetch-depth: 0

      - name: Resolve image name
        id: image
        run: |
          set -euo pipefail
          base_image_name="$(echo "${GITHUB_REPOSITORY}" | tr '[:upper:]' '[:lower:]')"
          image_name="${base_image_name}${IMAGE_SUFFIX}"
          echo "name=${image_name}" >> "$GITHUB_OUTPUT"
          echo "ref=${REGISTRY}/${image_name}" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Build and push image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            RELEASE_VERSION=${{ env.VERSION }}
            MIX_RELEASE_NAME=${{ matrix.mix_release }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.version=${{ env.VERSION }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.title=${{ matrix.image_title }}
          tags: |
            ${{ steps.image.outputs.ref }}:${{ env.VERSION }}
            ${{ steps.image.outputs.ref }}:${{ env.RELEASE_TAG }}
            ${{ steps.image.outputs.ref }}:latest

      - name: Prepare Docker image release note
        env:
          IMAGE_REF: ${{ steps.image.outputs.ref }}
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          note_file="docker-image-${IMAGE_KEY}.md"

          cat > "${note_file}" <<EOF
          ### ${IMAGE_TITLE}

          Pull the release image:

          \`\`\`sh
          docker pull ${IMAGE_REF}:${VERSION}
          docker pull ${IMAGE_REF}:${RELEASE_TAG}
          docker pull ${IMAGE_REF}:latest
          \`\`\`

          Multi-arch platforms: \`linux/amd64\`, \`linux/arm64\`

          Digest: \`${IMAGE_REF}@${IMAGE_DIGEST}\`
          EOF

      - name: Upload Docker image note
        uses: actions/upload-artifact@v4
        with:
          name: docker-note-${{ matrix.image_key }}
          path: docker-image-${{ matrix.image_key }}.md
          retention-days: 1

  update-docker-release-notes:
    name: Update Docker image release notes
    needs:
      - create-release
      - docker-image
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
    env:
      RELEASE_TAG: ${{ needs.create-release.outputs.tag }}
    steps:
      - name: Download Docker image notes
        uses: actions/download-artifact@v4
        with:
          pattern: docker-note-*
          path: docker-notes
          merge-multiple: true

      - name: Add Docker image info to release notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release view "${RELEASE_TAG}" --repo "${GITHUB_REPOSITORY}" --json body --jq '.body' > release-body.md
          mapfile -t note_files < <(find docker-notes -maxdepth 1 -type f -name 'docker-image-*.md' | sort)

          if [ "${#note_files[@]}" -eq 0 ]; then
            echo "no Docker image notes found" >&2
            exit 1
          fi

          {
            printf '## Docker images\n\n'
            for note_file in "${note_files[@]}"; do
              cat "${note_file}"
              printf '\n\n'
            done
          } > docker-image-notes.md

          awk '
            $0 == "## Docker image" || $0 == "## Docker images" { skip = 1; next }
            /^## / && skip { skip = 0 }
            !skip { print }
          ' release-body.md > release-body-base.md

          {
            cat release-body-base.md
            printf '\n\n'
            cat docker-image-notes.md
          } > release-body-updated.md

          gh release edit "${RELEASE_TAG}" --repo "${GITHUB_REPOSITORY}" --notes-file release-body-updated.md
