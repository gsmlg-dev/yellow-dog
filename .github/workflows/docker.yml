name: Nix Product Images

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      publish:
        description: Publish both product images to GHCR
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.product }} / ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        product: [management, worker]
        arch: [amd64, arm64]
        include:
          - arch: amd64
            system: x86_64-linux
            runner: ubuntu-latest
          - arch: arm64
            system: aarch64-linux
            runner: ubuntu-24.04-arm

    steps:
      - uses: actions/checkout@v6

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@v22

      - name: Setup Nix cache
        uses: DeterminateSystems/magic-nix-cache-action@v14

      - name: Build Docker image
        id: build
        run: |
          nix build --print-build-logs --accept-flake-config .#packages.${{ matrix.system }}.docker-${{ matrix.product }}
          [ ! -L result ] && exit 1
          echo "path=$(realpath result)" >> "$GITHUB_OUTPUT"

      - name: Upload image
        uses: actions/upload-artifact@v4
        with:
          name: container-${{ matrix.product }}-${{ matrix.arch }}
          path: ${{ steps.build.outputs.path }}
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Publish ${{ matrix.product }}
    if: github.event_name == 'workflow_dispatch' && inputs.publish
    needs: build
    runs-on: ubuntu-latest
    strategy:
      matrix:
        product: [management, worker]
    permissions:
      contents: read
      actions: read
      packages: write

    steps:
      - uses: actions/checkout@v6

      - name: Image tags
        id: tags
        run: |
          repository=$(printf '%s' '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')
          version=$(sed -n 's/.*version: "\([^"]*\)".*/\1/p' mix.exs | head -1)
          echo "image=ghcr.io/$repository-${{ matrix.product }}" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Download images
        uses: actions/download-artifact@v4
        with:
          pattern: container-${{ matrix.product }}-*
          path: images

      - name: Login to registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Publish separate product manifest
        env:
          IMAGE: ${{ steps.tags.outputs.image }}
          VERSION: ${{ steps.tags.outputs.version }}
        run: |
          set -euo pipefail
          for arch in amd64 arm64; do
            docker load < images/container-${{ matrix.product }}-"$arch"/*
            docker tag yellow_dog_${{ matrix.product }}:latest "$IMAGE:latest-$arch"
            docker push "$IMAGE:latest-$arch"
          done
          for tag in latest "$VERSION"; do
            docker manifest create "$IMAGE:$tag" "$IMAGE:latest-amd64" "$IMAGE:latest-arm64"
            docker manifest push "$IMAGE:$tag"
          done
