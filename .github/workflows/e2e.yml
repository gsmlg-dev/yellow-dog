name: E2E Tests

on:
  push:
    branches: ['*']
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      release_version:
        description: Optional Mix release version override
        required: false
        type: string

permissions:
  contents: read

jobs:
  release-e2e:
    name: E2E Release / ${{ matrix.release }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        release: [yellow_dog_management, yellow_dog_worker]
    env:
      RELEASE_VERSION: ${{ inputs.release_version || '' }}
    steps:
      - uses: actions/checkout@v6
      - uses: erlef/setup-beam@v1
        with:
          elixir-version: '1.18'
          otp-version: '28'
      - uses: dtolnay/rust-toolchain@stable
      - run: sudo apt-get update && sudo apt-get install -y postgresql util-linux coreutils iproute2
      - run: echo "$(pg_config --bindir)" >> "$GITHUB_PATH"
      - run: mix deps.get
      - name: Management release smoke
        if: matrix.release == 'yellow_dog_management'
        run: scripts/e2e/phase1_postgres.sh scripts/e2e/release_smoke.sh yellow_dog_management
      - name: Worker release smoke
        if: matrix.release == 'yellow_dog_worker'
        run: scripts/e2e/release_smoke.sh yellow_dog_worker
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-${{ matrix.release }}-logs
          path: |
            /tmp/yellow-dog-management-release-smoke.log
            /tmp/yellow-dog-phase1-pg.*/init.log
            /tmp/yellow-dog-phase1-pg.*/server.log
            /tmp/yellow-dog-worker-smoke-*/boot-*.log
          if-no-files-found: warn
