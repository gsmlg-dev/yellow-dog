name: Test

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Elixir
        uses: erlef/setup-beam@v1
        with:
          elixir-version: '1.18'
          otp-version: '28'

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y postgresql util-linux coreutils

      - name: Locate PostgreSQL tools
        run: echo "$(pg_config --bindir)" >> "$GITHUB_PATH"

      - name: Cache dependencies
        uses: actions/cache@v5
        with:
          path: |
            deps
            _build
          key: ${{ runner.os }}-mix-${{ hashFiles('**/mix.lock') }}
          restore-keys: |
            ${{ runner.os }}-mix-

      - name: Install dependencies
        run: |
          mix local.hex --force
          mix local.rebar --force
          mix deps.get

      - name: Run Phase 1 product tests with fresh PostgreSQL
        run: scripts/e2e/phase1_postgres.sh mix cmd --app yellow_dog_config_spec --app yellow_dog_management --app yellow_dog_worker mix test
