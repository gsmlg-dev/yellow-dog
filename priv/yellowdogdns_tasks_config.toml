# Yellow Dog Task Scheduler Configuration
# Job records and schedule reservations are stored in YellowDog.Store/Concord.

[tasks]
enabled = true
timezone = "Etc/UTC"

[tasks.sync.ip_country]
enabled = true
cron = "0 3 2 * *"
max_attempts = 3

[tasks.sync.ip_city]
enabled = true
cron = "30 3 2 * *"
max_attempts = 3

[tasks.sync.mac]
enabled = true
cron = "0 4 * * SUN"
max_attempts = 3
