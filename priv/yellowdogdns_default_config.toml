[core]
dns = true
mdns = true
dhcpv4 = true
dhcpv6 = true
identity = true

[dns]
listen = "0.0.0.0"
port = 53
tcp_enabled = true
debug = false  # Set to true to enable Abyss debug logging to console
mode = "forward"
upstream_servers = ["8.8.8.8", "1.1.1.1"]
data_path = "data/dns"
zone_data_path = "data/dns/zones"

[dns.zones.example.com]
type = "authoritative"
file = "priv/zones/example.com.zone"

[mdns]
listen = "0.0.0.0"
port = 5353

[dhcpv4]
listen = "0.0.0.0"
port = 67

[dhcpv6]
listen = "::"
port = 547




[[dhcpv6.pools]]
name = "ipv6-office"
preferred_lifetime = 3600
range_end = "2001:db8:1::200"
range_start = "2001:db8:1::100"
valid_lifetime = 7200

[identity]
data_path = "data/identity"

[identity.approval]
default_action = "pending"

[[identity.approval.policies]]
name = "token-approved"
description = "Auto-approve token-verified registrations"
action = "approve"

[identity.approval.policies.match]
trust_level = "token_verified"

[[dhcpv4.pools]]
gateway = "192.168.50.1"
lease_time = 3600
name = "office-lan"
range_end = "192.168.50.200"
range_start = "192.168.50.100"