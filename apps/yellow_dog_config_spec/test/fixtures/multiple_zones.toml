schema_version = 1
worker_id = "edge-02"
revision = 7

[[services]]
id = "dns-primary"
type = "dns"
desired_state = "stopped"
resources = ["zone-example", "zone-other"]
config = { listen_address = "127.0.0.1", port = 1053 }

[[resources]]
id = "zone-example"
type = "dns_zone"
schema_version = 1
version = 3
content = { name = "example.com.", records = [
  { name = "example.com.", type = "SOA", ttl = 3600, data = { mname = "ns1.example.com.", rname = "hostmaster.example.com.", serial = 2026093003, refresh = 3600, retry = 600, expire = 86400, minimum = 300 } },
  { name = "example.com.", type = "NS", ttl = 3600, data = { host = "ns1.example.com." } },
  { name = "ns1.example.com.", type = "A", ttl = 300, data = { address = "192.0.2.53" } }
] }

[[resources]]
id = "zone-other"
type = "dns_zone"
schema_version = 1
version = 1
content = { name = "other.example.", records = [
  { name = "other.example.", type = "SOA", ttl = 3600, data = { mname = "ns1.other.example.", rname = "hostmaster.other.example.", serial = 1, refresh = 3600, retry = 600, expire = 86400, minimum = 300 } },
  { name = "other.example.", type = "NS", ttl = 3600, data = { host = "ns1.other.example." } },
  { name = "ns1.other.example.", type = "A", ttl = 300, data = { address = "192.0.2.54" } }
] }
