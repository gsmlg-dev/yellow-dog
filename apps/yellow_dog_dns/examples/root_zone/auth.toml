# Root Zone Configuration - Authoritative Strategy
#
# This strategy loads the root zone from a local file.
# Useful for air-gapped environments or when you maintain
# a local copy of the root zone.

[dns.root_zone]
strategy = "auth"

# Path to the root zone file
# The file should be in standard BIND zone file format
zone_file = "/etc/yellowdog/zones/root.zone"

# Whether to fallback to embedded hints if zone file cannot be loaded
# Recommended: true (ensures service continuity)
# Set to false if you want strict control
fallback_to_hints = true

# Example: Use a different path
# zone_file = "/var/lib/dns/zones/root.zone"

# Note: The zone file must be manually updated when the root zone changes.
# You can download the latest root zone from:
# https://www.internic.net/domain/root.zone
