[package]
name = "netlink_helper"
version = "0.1.0"
edition = "2021"
description = "Netlink event monitor and command executor for YellowDog NetMan"

[dependencies]
netlink-packet-route = "0.20"
netlink-packet-core = "0.7"
netlink-packet-utils = "0.5"
netlink-sys = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
libc = "0.2"

[profile.release]
lto = true
codegen-units = 1
strip = true
