[core]
# Service enable/disable flags
dns = true
mdns = false
dhcpv4 = false
dhcpv6 = false

[dns]
listen = "0.0.0.0"
port = 5353

[dns.zones]
"example.com" = { type = "authoritative", file = "priv/zones/example.com.zone" }

[mdns]
listen = "0.0.0.0"
port = 5353

[dhcpv4]
listen = "0.0.0.0"
port = 67

[dhcpv6]
listen = "::"
port = 547

[server]
logging-facility = "local0"
logging-level = "warning"
console = true
bind = ["any"]
ipv4-only = false
ipv6-only = false
telemetry = false
padding = true
reporting-agent = ""
report-via-dns = false

[forwarder]
server = "8.8.8.8"
override-ecs = false
ecs-addr = "114.249.114.18"
ecs-prefix = 24
