schema_version = 1
worker_id = "edge-01"
revision = 1

[[services]]
id = "dns-primary"
type = "dns"
desired_state = "running"
resources = ["zone-example"]
config = { listen_address = "127.0.0.1", port = 1053 }

[[resources]]
id = "zone-example"
type = "dns_zone"
schema_version = 1
version = 1

[resources.content]
name = "example.com."

[[resources.content.records]]
name = "example.com."
type = "SOA"
ttl = 3600
data = { mname = "ns1.example.com.", rname = "hostmaster.example.com.", serial = 2026093001, refresh = 3600, retry = 600, expire = 86400, minimum = 300 }

[[resources.content.records]]
name = "example.com."
type = "NS"
ttl = 3600
data = { host = "ns1.example.com." }

[[resources.content.records]]
name = "ns1.example.com."
type = "A"
ttl = 300
data = { address = "192.0.2.53" }
